name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY: confiturejeu

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p "package"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/${BINARY}.exe" package/
          else
            cp "target/${{ matrix.target }}/release/${BINARY}" package/
          fi
          [ -d assets ] && cp -r assets package/ || true
          [ -f README.md ] && cp README.md package/ || true

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY }}-${{ matrix.name }}
          path: package/

  web:
    name: web-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-wasm
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli

      - name: Build
        run: cargo build --profile wasm-release --target wasm32-unknown-unknown

      - name: Bundle
        run: |
          wasm-bindgen --no-typescript --target web \
            --out-dir ./dist --out-name "${BINARY}" \
            "./target/wasm32-unknown-unknown/wasm-release/${BINARY}.wasm"
          [ -d assets ] && cp -r assets ./dist/ || true
          cp web/index.html ./dist/index.html

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY }}-web
          path: dist/
