<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>confiturejeu</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #1a1a1a;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #eee;
        font: 16px/1.4 system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="loading">Loading…</div>
    <script type="module">
      import init from "./confiturejeu.js";
      init().then(() => {
        document.getElementById("loading")?.remove();
      });
    </script>
  </body>
</html>
